Entities:
  - Name: Role
    Features:
      - Type: AddRecord
      - Type: GetRecord
      - Type: GetList
      - Type: UpdateRecord
      - Type: DeleteRecord
    Properties:
      - Name: RoleName
        Type: string

  - Name: Permission
    Features:
      - Type: AddRecord
      - Type: GetRecord
      - Type: GetList
      - Type: DeleteRecord
    Properties:
      - Name: PermissionName
        Type: string
      - Name: Description
        Type: string?

  - Name: RolePermission
    Properties:
      - Name: Role
        Relationship: manyto1
        ForeignEntityName: Role
        ForeignEntityPlural: Roles
      - Name: Permission
        Relationship: manyto1
        ForeignEntityName: Permission
        ForeignEntityPlural: Permissions